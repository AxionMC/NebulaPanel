name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（留空则取 tag，否则 VERSION + sha）'
        required: false
        default: ''

# 默认权限最小化，需要写权限的 job 单独声明
permissions:
  contents: read

env:
  # ---- Go 构建环境（关键：全部显式声明，避免 runner 默认值差异）----
  GO111MODULE: 'on'
  GOTOOLCHAIN: 'local'          # 禁止自动下载其他 Go 版本，避免静默失败
  CGO_ENABLED: '0'
  GOFLAGS: '-mod=mod'           # 允许构建期补齐 go.sum
  GOSUMDB: 'sum.golang.org'
  GO_VERSION_DEFAULT: '1.27.3'
  # ---- 其他 ----
  NODE_VERSION: '20'
  CORE_NAME: NebulaPanel-core
  AGENT_NAME: NebulaPanel-agent

jobs:
  # ==========================================================================
  # 0. 预检：BOM / 换行符 / 关键文件存在性
  # ==========================================================================
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check BOM
        shell: bash
        run: |
          chmod +x scripts/*.sh
          bash scripts/check-bom.sh

      - name: Check CRLF in shell scripts
        shell: bash
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f" 2>/dev/null; then
              echo "::error file=$f::脚本含 CRLF，Linux 上会报 bad interpreter"
              bad=1
            fi
          done < <(find scripts -name '*.sh' -o -name 'npctl' | sort)
          [ "$bad" -eq 0 ] && echo "脚本换行符全部为 LF"

      - name: Check required sources
        shell: bash
        run: |
          set -e
          for f in core/go.mod agent/go.mod \
                   core/cmd/server/main.go \
                   core/cmd/server/cmd/root.go \
                   core/cmd/server/docs/docs.go \
                   core/cmd/server/web/web.go \
                   core/cmd/server/web/favicon.png \
                   frontend/package.json frontend/vite.config.ts; do
            [ -e "$f" ] || { echo "::error::缺少必需文件 $f"; exit 1; }
          done
          echo "关键源码齐全"
          echo "--- 包声明抽样 ---"
          head -1 core/cmd/server/main.go
          head -1 core/cmd/server/cmd/root.go
          head -1 core/cmd/server/docs/docs.go

  # ==========================================================================
  # 1. 前端构建
  # ==========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/package-lock.json', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            echo "使用 pnpm"
            pnpm install --no-frozen-lockfile
          else
            echo "使用 npm"
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build:pro
          else
            npm run build:pro
          fi

      - name: Verify frontend output
        shell: bash
        run: |
          set -e
          WEB=core/cmd/server/web
          echo "--- $WEB ---"
          ls -la "$WEB"
          for f in index.html favicon.png web.go; do
            if [ ! -f "$WEB/$f" ]; then
              echo "::error::$WEB/$f 缺失，core 的 go:embed 会失败"
              exit 1
            fi
          done
          if [ ! -d "$WEB/static" ]; then
            echo "::error::$WEB/static 缺失（web.go 有 //go:embed static/*）"
            exit 1
          fi
          if [ ! -d "$WEB/assets" ]; then
            echo "::error::$WEB/assets 缺失（web.go 有 //go:embed all:assets）"
            exit 1
          fi
          echo "前端产物校验通过"

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: core/cmd/server/web
          retention-days: 1
          if-no-files-found: error

  # ==========================================================================
  # 2. 后端构建（amd64 / arm64）
  # ==========================================================================
  build-backend:
    name: Build Backend (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: core/cmd/server/web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.GO_VERSION || '1.27.3' }}
          check-latest: false
          cache: true
          cache-dependency-path: |
            core/go.sum
            agent/go.sum

      - name: Resolve build version
        id: ver
        shell: bash
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            BASE="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
            [ -z "$BASE" ] && BASE="V1.0.0"
            V="${BASE}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本：$V"

      - name: Environment diagnostics
        shell: bash
        run: |
          set -x
          go version
          go env GOOS GOARCH GO111MODULE GOFLAGS GOTOOLCHAIN GOPROXY GOMOD GOWORK GOROOT GOPATH
          echo "--- repo layout ---"
          ls -la
          echo "--- core/cmd/server ---"
          ls -la core/cmd/server || true
          echo "--- core/cmd/server/cmd ---"
          ls -la core/cmd/server/cmd || true
          echo "--- core/cmd/server/docs ---"
          ls -la core/cmd/server/docs || true
          echo "--- core/cmd/server/web ---"
          ls -la core/cmd/server/web || true
          echo "--- go.mod heads ---"
          head -6 core/go.mod
          head -8 agent/go.mod

      - name: Resolve core module
        working-directory: core
        shell: bash
        run: |
          set -e
          echo "GOMOD=$(go env GOMOD)"
          go mod download
          # 逐个确认两个引发争议的包能被解析
          go list ./cmd/server/cmd
          go list ./cmd/server/docs
          go list ./cmd/server

      - name: Resolve agent module
        working-directory: agent
        shell: bash
        run: |
          set -e
          go mod tidy
          go list ./cmd/server

      - name: Build ${{ env.CORE_NAME }}
        working-directory: core
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p ../build
          # 注意：这里构建「包目录」./cmd/server，而不是单文件 ./cmd/server/main.go。
          # 传单个 .go 文件时 go 会以 command-line-arguments 包处理，
          # 在部分 runner 环境下会报 cannot find package。
          go build -trimpath -ldflags '-s -w' \
            -o "../build/${CORE_NAME}-${{ matrix.goarch }}" \
            ./cmd/server

      - name: Build ${{ env.AGENT_NAME }}
        working-directory: agent
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p ../build
          go build -trimpath -ldflags '-s -w' \
            -o "../build/${AGENT_NAME}-${{ matrix.goarch }}" \
            ./cmd/server

      - name: Verify binaries
        shell: bash
        run: |
          set -e
          file build/* || true
          ls -lh build
          # 交叉编译产物必须是目标架构的 ELF
          "${{ github.workspace }}/scripts/check-elf.sh" "build/${CORE_NAME}-${{ matrix.goarch }}" "${{ matrix.goarch }}"
          "${{ github.workspace }}/scripts/check-elf.sh" "build/${AGENT_NAME}-${{ matrix.goarch }}" "${{ matrix.goarch }}"

      - name: Package binaries
        shell: bash
        run: |
          set -e
          cd build
          TGZ="NebulaPanel-linux-${{ matrix.goarch }}.tar.gz"
          tar -czf "$TGZ" "${CORE_NAME}-${{ matrix.goarch }}" "${AGENT_NAME}-${{ matrix.goarch }}"
          sha256sum "$TGZ" > "$TGZ.sha256"
          ls -lh

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nebulapanel-linux-${{ matrix.goarch }}
          path: |
            build/NebulaPanel-linux-${{ matrix.goarch }}.tar.gz
            build/NebulaPanel-linux-${{ matrix.goarch }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # 3. Docker 镜像（多架构 manifest，仅 tag / 手动）
  # ==========================================================================
  build-docker:
    name: Build Docker Image (multi-arch)
    runs-on: ubuntu-latest
    needs: build-backend
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64
        uses: actions/download-artifact@v4
        with:
          name: nebulapanel-linux-amd64
          path: artifacts/amd64

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: nebulapanel-linux-arm64
          path: artifacts/arm64

      - name: Prepare multi-arch context
        shell: bash
        run: |
          set -e
          mkdir -p docker-context
          for arch in amd64 arm64; do
            mkdir -p "docker-context/${arch}"
            tar -xzf "artifacts/${arch}/NebulaPanel-linux-${arch}.tar.gz" -C "docker-context/${arch}"
            mv "docker-context/${arch}/${CORE_NAME}-${arch}"  "docker-context/${arch}/${CORE_NAME}"
            mv "docker-context/${arch}/${AGENT_NAME}-${arch}" "docker-context/${arch}/${AGENT_NAME}"
            chmod +x "docker-context/${arch}/${CORE_NAME}" "docker-context/${arch}/${AGENT_NAME}"
          done
          find docker-context -maxdepth 2 -type f | sort

      - name: Write Dockerfile
        shell: bash
        run: |
          set -e
          cat > docker-context/Dockerfile <<'EOF'
          FROM debian:bookworm-slim

          ARG TARGETARCH

          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates tzdata \
              && rm -rf /var/lib/apt/lists/*

          RUN mkdir -p /opt/NebulaPanel/conf /opt/NebulaPanel/db /opt/NebulaPanel/secret \
                       /opt/NebulaPanel/logs /opt/NebulaPanel/backup /opt/NebulaPanel/geo \
                       /opt/NebulaPanel/tmp
          WORKDIR /opt/NebulaPanel

          COPY ${TARGETARCH}/NebulaPanel-core /usr/local/bin/NebulaPanel-core
          COPY ${TARGETARCH}/NebulaPanel-agent /usr/local/bin/NebulaPanel-agent
          RUN chmod +x /usr/local/bin/NebulaPanel-core /usr/local/bin/NebulaPanel-agent

          EXPOSE 9999
          ENTRYPOINT ["NebulaPanel-core", "start"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================================================
  # 4. Release（仅 tag）
  # ==========================================================================
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-backend
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -e
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NebulaPanel ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
          body: |
            ## NebulaPanel ${{ github.ref_name }}

            Linux 运维管理面板，Go + Vue 3 构建，版本固定 V1.0.0 系列。

            ### 一键安装

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd NebulaPanel
            sudo bash scripts/install.sh
            ```

            安装脚本全程交互式：安装目录、端口、安全入口、管理员账号与密码均可自定义。

            ### 二进制

            | 架构 | 文件 |
            |------|------|
            | x86_64 | `NebulaPanel-linux-amd64.tar.gz` |
            | ARM64  | `NebulaPanel-linux-arm64.tar.gz` |

            每个压缩包含 `NebulaPanel-core` 与 `NebulaPanel-agent`，并附 `.sha256` 校验值。
